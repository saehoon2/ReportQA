# ReportQA 실행 구성 (구조도 5)
#   docker compose up -d db     → DB만 켜기 (5주차: 내 PC에서 서버를 직접 실행할 때)
# 값은 .env 에서 읽고, 없으면 개발용 기본값(reportqa)을 씁니다.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reportqa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reportqa}
      POSTGRES_DB: ${POSTGRES_DB:-reportqa}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # 내 컴퓨터에서만 접속 가능
    volumes:
      - pgdata:/var/lib/postgresql/data           # 컨테이너를 지워도 DB 내용이 남는 저장 공간
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reportqa} -d ${POSTGRES_DB:-reportqa}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
